      .attr-text { font-family: monospace; font-size: 10px; fill: #334155; }
      .method-text { font-family: monospace; font-size: 10px; fill: #0f172a; }
      .divider { stroke: #cbd5e1; stroke-width: 1; }
      
      .dep-line { stroke: #4b5563; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
