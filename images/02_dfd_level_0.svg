<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#ffffff" />

  <!-- Title -->
  <text x="700" y="40" font-family="sans-serif" font-size="20px" font-weight="bold" fill="#000000" text-anchor="middle">KajBazar Level 0 Data Flow Diagram</text>

  <!-- Legend -->
  <g transform="translate(50, 950)">
    <rect x="0" y="0" width="20" height="20" fill="#1e3a8a" rx="4" />
    <text x="30" y="15" font-family="sans-serif" font-size="14px" fill="#000000">External Entity</text>
    
    <rect x="150" y="0" width="20" height="20" fill="#059669" rx="10" />
    <text x="180" y="15" font-family="sans-serif" font-size="14px" fill="#000000">Process</text>
    
    <rect x="270" y="0" width="20" height="20" fill="#d97706" />
    <rect x="270" y="2" width="20" height="16" fill="#ffffff" />
    <rect x="270" y="4" width="20" height="12" fill="#d97706" />
    <text x="300" y="15" font-family="sans-serif" font-size="14px" fill="#000000">Data Store</text>
  </g>

  <!-- Flow Paths & Labels -->
  
  <!-- Consumer <-> System -->
  <path d="M 280 130 Q 350 250 560 380" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370" y="240" font-family="sans-serif" font-size="12px" fill="#000000" transform="rotate(30, 370, 240)">Auth Request, Search Criteria, Reviews, Referrals</text>
  
  <path d="M 540 360 Q 310 230 240 130" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="340" y="210" font-family="sans-serif" font-size="12px" fill="#000000" transform="rotate(30, 340, 210)">JWT Token, Filtered Worker Profiles, Contact Info</text>

  <!-- Worker <-> System -->
  <path d="M 680 130 L 680 340" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="690" y="235" font-family="sans-serif" font-size="12px" fill="#000000">Profile Details, Skills, Rates, Location</text>
  
  <path d="M 720 340 L 720 130" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="500" y="235" font-family="sans-serif" font-size="12px" fill="#000000">Verification Status, Reviews, Rating Scores</text>

  <!-- Admin <-> System -->
  <path d="M 1120 130 Q 1050 250 840 380" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="960" y="230" font-family="sans-serif" font-size="12px" fill="#000000" transform="rotate(-30, 960, 230)">Moderation Approvals/Rejections, Taxonomy Config</text>
  
  <path d="M 860 360 Q 1090 230 1160 130" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1010" y="260" font-family="sans-serif" font-size="12px" fill="#000000" transform="rotate(-30, 1010, 260)">Analytics Metrics, Verification Queues, Logs</text>

  <!-- System <-> D1 -->
  <path d="M 600 450 Q 500 550 300 670" fill="none" stroke="#333333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="440" y="550" font-family="sans-serif" font-size="12px" fill="#000000" transform="rotate(35, 440, 550)">Read / Write Credentials &amp; Roles</text>

  <!-- System <-> D2 -->
  <path d="M 700 460 L 700 670" fill="none" stroke="#333333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="710" y="570" font-family="sans-serif" font-size="12px" fill="#000000">Read / Write Worker Data &amp; Categories</text>

  <!-- System -> D3 -->
  <path d="M 800 450 Q 900 550 1100 670" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="940" y="540" font-family="sans-serif" font-size="12px" fill="#000000" transform="rotate(-35, 940, 540)">Lookup District &amp; Upazila Boundaries</text>

  <!-- System <-> D4 -->
  <path d="M 580 440 Q 300 600 280 820" fill="none" stroke="#333333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="350" y="650" font-family="sans-serif" font-size="12px" fill="#000000" transform="rotate(50, 350, 650)">Store &amp; Aggregate Star Ratings</text>

  <!-- System <-> D5 -->
  <path d="M 720 460 Q 750 650 720 820" fill="none" stroke="#333333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="740" y="650" font-family="sans-serif" font-size="12px" fill="#000000">Store &amp; Update Referral Status</text>

  <!-- System -> D6 -->
  <path d="M 820 440 Q 1100 600 1120 820" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1000" y="620" font-family="sans-serif" font-size="12px" fill="#000000" transform="rotate(-40, 1000, 620)">Append Administrative Actions</text>

  <!-- EXTERNAL ENTITIES -->
  <!-- Consumer -->
  <g transform="translate(150, 70)">
    <rect x="0" y="0" width="200" height="60" fill="#1e3a8a" rx="8" />
    <text x="100" y="35" font-family="sans-serif" font-size="16px" font-weight="bold" fill="#ffffff" text-anchor="middle">Consumer</text>
  </g>

  <!-- Service Provider -->
  <g transform="translate(600, 70)">
    <rect x="0" y="0" width="200" height="60" fill="#1e3a8a" rx="8" />
    <text x="100" y="35" font-family="sans-serif" font-size="16px" font-weight="bold" fill="#ffffff" text-anchor="middle">Service Provider</text>
  </g>

  <!-- Administrator -->
  <g transform="translate(1050, 70)">
    <rect x="0" y="0" width="200" height="60" fill="#1e3a8a" rx="8" />
    <text x="100" y="35" font-family="sans-serif" font-size="16px" font-weight="bold" fill="#ffffff" text-anchor="middle">Administrator</text>
  </g>

  <!-- PROCESS -->
  <!-- 0.0 KajBazar Service Provider Directory Platform -->
  <g transform="translate(540, 340)">
    <rect x="0" y="0" width="320" height="120" fill="#059669" rx="20" />
    <text x="160" y="35" font-family="sans-serif" font-size="18px" font-weight="bold" fill="#ffffff" text-anchor="middle">0.0</text>
    <text x="160" y="65" font-family="sans-serif" font-size="18px" font-weight="bold" fill="#ffffff" text-anchor="middle">KajBazar Service Provider</text>
    <text x="160" y="95" font-family="sans-serif" font-size="18px" font-weight="bold" fill="#ffffff" text-anchor="middle">Directory Platform</text>
  </g>

  <!-- DATA STORES -->
  <!-- Row 1 -->
  <!-- D1: Users & Roles Store -->
  <g transform="translate(150, 670)">
    <path d="M 0 0 L 200 0 M 0 60 L 200 60" fill="none" stroke="#d97706" stroke-width="4" />
    <rect x="5" y="4" width="190" height="52" fill="#d97706" />
    <text x="100" y="35" font-family="sans-serif" font-size="14px" font-weight="bold" fill="#ffffff" text-anchor="middle">D1: Users &amp; Roles Store</text>
  </g>

  <!-- D2: Worker Profiles & Categories Store -->
  <g transform="translate(600, 670)">
    <path d="M 0 0 L 200 0 M 0 60 L 200 60" fill="none" stroke="#d97706" stroke-width="4" />
    <rect x="5" y="4" width="190" height="52" fill="#d97706" />
    <text x="100" y="35" font-family="sans-serif" font-size="13px" font-weight="bold" fill="#ffffff" text-anchor="middle">D2: Worker Profiles &amp; Categories</text>
  </g>

  <!-- D3: Geography Store -->
  <g transform="translate(1050, 670)">
    <path d="M 0 0 L 200 0 M 0 60 L 200 60" fill="none" stroke="#d97706" stroke-width="4" />
    <rect x="5" y="4" width="190" height="52" fill="#d97706" />
    <text x="100" y="35" font-family="sans-serif" font-size="14px" font-weight="bold" fill="#ffffff" text-anchor="middle">D3: Geography Store</text>
  </g>

  <!-- Row 2 -->
  <!-- D4: Ratings & Reviews Store -->
  <g transform="translate(150, 820)">
    <path d="M 0 0 L 200 0 M 0 60 L 200 60" fill="none" stroke="#d97706" stroke-width="4" />
    <rect x="5" y="4" width="190" height="52" fill="#d97706" />
    <text x="100" y="35" font-family="sans-serif" font-size="14px" font-weight="bold" fill="#ffffff" text-anchor="middle">D4: Ratings &amp; Reviews Store</text>
  </g>

  <!-- D5: Community Recommendations Store -->
  <g transform="translate(600, 820)">
    <path d="M 0 0 L 200 0 M 0 60 L 200 60" fill="none" stroke="#d97706" stroke-width="4" />
    <rect x="5" y="4" width="190" height="52" fill="#d97706" />
    <text x="100" y="35" font-family="sans-serif" font-size="12px" font-weight="bold" fill="#ffffff" text-anchor="middle">D5: Community Recommendations</text>
  </g>

  <!-- D6: Admin Audit Trail Store -->
  <g transform="translate(1050, 820)">
    <path d="M 0 0 L 200 0 M 0 60 L 200 60" fill="none" stroke="#d97706" stroke-width="4" />
    <rect x="5" y="4" width="190" height="52" fill="#d97706" />
    <text x="100" y="35" font-family="sans-serif" font-size="14px" font-weight="bold" fill="#ffffff" text-anchor="middle">D6: Admin Audit Trail Store</text>
  </g>
</svg>
