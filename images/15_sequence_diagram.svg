<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <defs>
    <!-- Arrow heads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <style>
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
      .label { font-family: sans-serif; font-size: 11px; fill: #222; }
      .participant { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #fff; text-anchor: middle; }
      .number { font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #333; stroke-width: 1.5; }
      .dashed { stroke: #333; stroke-width: 1.5; stroke-dasharray: 5,5; }
      .lifeline { stroke: #999; stroke-width: 1.5; stroke-dasharray: 5,5; }
      .activation { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="700" y="40" class="title" text-anchor="middle">Scenario: Multi-Criteria Search &amp; Direct Contact (BR-05, BR-06)</text>

  <!-- Lifelines -->
  <line x1="150" y1="100" x2="150" y2="750" class="lifeline" />
  <line x1="425" y1="100" x2="425" y2="750" class="lifeline" />
  <line x1="700" y1="100" x2="700" y2="750" class="lifeline" />
  <line x1="975" y1="100" x2="975" y2="750" class="lifeline" />
  <line x1="1250" y1="100" x2="1250" y2="750" class="lifeline" />

  <!-- Activation Bars -->
  <rect x="145" y="170" width="10" height="500" class="activation" />
  <rect x="420" y="175" width="10" height="440" class="activation" />
  <rect x="695" y="225" width="10" height="240" class="activation" />
  <rect x="970" y="275" width="10" height="140" class="activation" />
  <rect x="1245" y="325" width="10" height="40" class="activation" />

  <!-- Participants -->
  <g transform="translate(100, 70)">
    <rect width="100" height="40" rx="4" fill="#3b82f6" />
    <text x="50" y="25" class="participant">Consumer</text>
  </g>
  <g transform="translate(350, 70)">
    <rect width="150" height="40" rx="4" fill="#3b82f6" />
    <text x="75" y="25" class="participant">React Frontend</text>
  </g>
  <g transform="translate(625, 70)">
    <rect width="150" height="40" rx="4" fill="#059669" />
    <text x="75" y="25" class="participant">WorkersController</text>
  </g>
  <g transform="translate(900, 70)">
    <rect width="150" height="40" rx="4" fill="#0d9488" />
    <text x="75" y="25" class="participant">Repository</text>
  </g>
  <g transform="translate(1175, 70)">
    <rect width="150" height="40" rx="4" fill="#d97706" />
    <text x="75" y="25" class="participant">PostgreSQL</text>
  </g>

  <!-- Messages -->
  
  <!-- 1. Consumer -> UI -->
  <g transform="translate(0, 180)">
    <circle cx="170" cy="-7" r="7" fill="#333" />
    <text x="170" y="-7" class="number">1</text>
    <text x="185" y="-3" class="label">Selects "Electrician", District "Patuakhali", Upazila "Dumki"</text>
    <line x1="155" y1="5" x2="415" y2="5" class="line" marker-end="url(#arrow)" />
  </g>

  <!-- 2. UI -> API -->
  <g transform="translate(0, 230)">
    <circle cx="445" cy="-7" r="7" fill="#333" />
    <text x="445" y="-7" class="number">2</text>
    <text x="460" y="-3" class="label">GET /api/workers/search?category=Electrician&amp;districtId=1&amp;upazilaId=1</text>
    <line x1="430" y1="5" x2="690" y2="5" class="line" marker-end="url(#arrow)" />
  </g>

  <!-- 3. API -> Repo -->
  <g transform="translate(0, 280)">
    <circle cx="720" cy="-7" r="7" fill="#333" />
    <text x="720" y="-7" class="number">3</text>
    <text x="735" y="-3" class="label">SearchWorkersAsync("Electrician", 1, 1, null, page=1)</text>
    <line x1="705" y1="5" x2="965" y2="5" class="line" marker-end="url(#arrow)" />
  </g>

  <!-- 4. Repo -> DB -->
  <g transform="translate(0, 330)">
    <circle cx="995" cy="-7" r="7" fill="#333" />
    <text x="995" y="-7" class="number">4</text>
    <text x="1010" y="-3" class="label">SELECT * FROM service_provider_profiles WHERE verification_status = 'VERIFIED' AND ...</text>
    <line x1="980" y1="5" x2="1240" y2="5" class="line" marker-end="url(#arrow)" />
  </g>

  <!-- 5. DB -> Repo -->
  <g transform="translate(0, 380)">
    <circle cx="1225" cy="-7" r="7" fill="#333" />
    <text x="1225" y="-7" class="number">5</text>
    <text x="1210" y="-3" class="label" text-anchor="end">Returns verified worker records + total count</text>
    <line x1="1240" y1="5" x2="980" y2="5" class="dashed" marker-end="url(#arrow-dashed)" />
  </g>

  <!-- 6. Repo -> API -->
  <g transform="translate(0, 430)">
    <circle cx="950" cy="-7" r="7" fill="#333" />
    <text x="950" y="-7" class="number">6</text>
    <text x="935" y="-3" class="label" text-anchor="end">(WorkersList, TotalCount)</text>
    <line x1="965" y1="5" x2="705" y2="5" class="dashed" marker-end="url(#arrow-dashed)" />
  </g>

  <!-- 7. API -> UI -->
  <g transform="translate(0, 480)">
    <circle cx="675" cy="-7" r="7" fill="#333" />
    <text x="675" y="-7" class="number">7</text>
    <text x="660" y="-3" class="label" text-anchor="end">200 OK JSON { totalCount, totalPages, workers[] }</text>
    <line x1="690" y1="5" x2="430" y2="5" class="dashed" marker-end="url(#arrow-dashed)" />
  </g>

  <!-- 8. UI -> Consumer -->
  <g transform="translate(0, 530)">
    <circle cx="400" cy="-7" r="7" fill="#333" />
    <text x="400" y="-7" class="number">8</text>
    <text x="385" y="-3" class="label" text-anchor="end">Renders Worker Cards with Rating 4.8 &amp; Experience</text>
    <line x1="415" y1="5" x2="155" y2="5" class="dashed" marker-end="url(#arrow-dashed)" />
  </g>

  <!-- 9. Consumer -> UI -->
  <g transform="translate(0, 580)">
    <circle cx="170" cy="-7" r="7" fill="#333" />
    <text x="170" y="-7" class="number">9</text>
    <text x="185" y="-3" class="label">Clicks "Contact Worker"</text>
    <line x1="155" y1="5" x2="415" y2="5" class="line" marker-end="url(#arrow)" />
  </g>

  <!-- 10. UI -> Consumer -->
  <g transform="translate(0, 630)">
    <circle cx="400" cy="-7" r="7" fill="#333" />
    <text x="400" y="-7" class="number">10</text>
    <text x="385" y="-3" class="label" text-anchor="end">Reveals Raw Phone Number "01811111111" (tel:01811111111)</text>
    <line x1="415" y1="5" x2="155" y2="5" class="dashed" marker-end="url(#arrow-dashed)" />
  </g>

  <!-- 11. Consumer self-message -->
  <g transform="translate(0, 680)">
    <circle cx="170" cy="-25" r="7" fill="#333" />
    <text x="170" y="-25" class="number">11</text>
    <text x="185" y="-21" class="label">Directly dials tradesperson</text>
    <path d="M 145 0 C 100 0 100 30 145 30" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

</svg>
