<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2100 1350" width="100%" height="100%" style="background:#ffffff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-c-in" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#0284c7" />
    </marker>
    <marker id="arr-c-out" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#0369a1" />
    </marker>

    <marker id="arr-w-in" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#ea580c" />
    </marker>
    <marker id="arr-w-out" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#c2410c" />
    </marker>

    <marker id="arr-adm-in" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-adm-out" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#6d28d9" />
    </marker>

    <marker id="arr-ds-in" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#d97706" />
    </marker>
    <marker id="arr-ds-rev" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 2 L 2 5 L 9 8 z" fill="#d97706" />
    </marker>

    <!-- Filters -->
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="hub-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#059669" flood-opacity="0.14"/>
    </filter>
  </defs>

  <style>
    .flow-line { fill: none; stroke-width: 1.8; }
    .label-box { rx: 4; ry: 4; stroke-width: 1.2; }
    .flow-text { font-size: 11px; font-weight: 600; dominant-baseline: middle; }
    .flow-num { font-weight: 800; }
    .cylinder-top { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .cylinder-body { fill: #ffffff; stroke: #d97706; stroke-width: 2; }
  </style>

  <!-- Background Grid -->
  <g opacity="0.45" stroke="#f1f5f9" stroke-width="1">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <!-- Header -->
  <g transform="translate(60, 42)">
    <text fill="#0f172a" font-size="24" font-weight="800" letter-spacing="-0.3">KajBazar Level 0 Data Flow Diagram (DFD)</text>
    <text fill="#64748b" font-size="13.5" font-weight="500" y="25">Interaction Architecture: Actors, Core Directory Platform &amp; Central Data Stores</text>
  </g>

  <!-- ======================================================================== -->
  <!-- 1. FLOW TRAJECTORIES                                                     -->
  <!-- ======================================================================== -->

  <!-- Top In/Out: Consumer, Admin, Worker Flows -->
  <g id="trajectories-top-entities">
    <!-- Consumer Inflow (C -> System) -->
    <line x1="360" y1="210" x2="880" y2="350" class="flow-line" stroke="#0284c7" marker-end="url(#arr-c-in)" />
    <!-- Consumer Outflow (System -> C) -->
    <line x1="860" y1="380" x2="360" y2="245" class="flow-line" stroke="#0369a1" stroke-dasharray="5 3.5" marker-end="url(#arr-c-out)" />

    <!-- Admin Inflow (Admin -> System) -->
    <line x1="1025" y1="210" x2="1025" y2="300" class="flow-line" stroke="#7c3aed" marker-end="url(#arr-adm-in)" />
    <!-- Admin Outflow (System -> Admin) -->
    <line x1="1075" y1="300" x2="1075" y2="210" class="flow-line" stroke="#6d28d9" stroke-dasharray="5 3.5" marker-end="url(#arr-adm-out)" />

    <!-- Worker Inflow (Worker -> System) -->
    <line x1="1740" y1="210" x2="1220" y2="350" class="flow-line" stroke="#ea580c" marker-end="url(#arr-w-in)" />
    <!-- Worker Outflow (System -> Worker) -->
    <line x1="1240" y1="380" x2="1740" y2="245" class="flow-line" stroke="#c2410c" stroke-dasharray="5 3.5" marker-end="url(#arr-w-out)" />
  </g>

  <!-- Bottom Data Store Trajectories -->
  <g id="trajectories-datastores">
    <!-- D1: Users & Roles (Bidirectional) -->
    <line x1="880" y1="570" x2="230" y2="820" class="flow-line" stroke="#d97706" marker-start="url(#arr-ds-rev)" marker-end="url(#arr-ds-in)" />

    <!-- D2: Worker Profiles (Bidirectional) -->
    <line x1="930" y1="620" x2="560" y2="820" class="flow-line" stroke="#d97706" marker-start="url(#arr-ds-rev)" marker-end="url(#arr-ds-in)" />

    <!-- D3: Geography (System -> D3) -->
    <line x1="990" y1="650" x2="890" y2="820" class="flow-line" stroke="#d97706" marker-end="url(#arr-ds-in)" />

    <!-- D4: Ratings & Reviews (Bidirectional) -->
    <line x1="1110" y1="650" x2="1210" y2="820" class="flow-line" stroke="#d97706" marker-start="url(#arr-ds-rev)" marker-end="url(#arr-ds-in)" />

    <!-- D5: Community Recommendations (Bidirectional) -->
    <line x1="1170" y1="620" x2="1540" y2="820" class="flow-line" stroke="#d97706" marker-start="url(#arr-ds-rev)" marker-end="url(#arr-ds-in)" />

    <!-- D6: Admin Audit Trail (System -> D6) -->
    <line x1="1220" y1="570" x2="1870" y2="820" class="flow-line" stroke="#d97706" marker-end="url(#arr-ds-in)" />
  </g>

  <!-- ======================================================================== -->
  <!-- 2. LABELS (Centrally Hosted with Opaque Backing)                         -->
  <!-- ======================================================================== -->

  <!-- Consumer Labels -->
  <g id="labels-consumer">
    <rect x="420" y="250" width="310" height="24" class="label-box" fill="#ffffff" stroke="#bae6fd" />
    <text x="430" y="263" class="flow-text" fill="#0369a1"><tspan class="flow-num" fill="#0284c7">1.</tspan> Auth Request, Search Criteria, Reviews, Referrals</text>

    <rect x="430" y="325" width="310" height="24" class="label-box" fill="#f0f9ff" stroke="#7dd3fc" />
    <text x="440" y="338" class="flow-text" fill="#0369a1"><tspan class="flow-num" fill="#0284c7">2.</tspan> JWT Token, Filtered Worker Profiles, Contact Info</text>
  </g>

  <!-- Admin Labels -->
  <g id="labels-admin">
    <g transform="translate(1015, 255) rotate(-90)">
      <rect x="-95" y="-12" width="190" height="24" class="label-box" fill="#ffffff" stroke="#ddd6fe" />
      <text x="0" y="1" class="flow-text" text-anchor="middle" fill="#6d28d9">Approvals, Taxonomy Config</text>
    </g>
    <g transform="translate(1085, 255) rotate(-90)">
      <rect x="-95" y="-12" width="190" height="24" class="label-box" fill="#faf5ff" stroke="#c4b5fd" />
      <text x="0" y="1" class="flow-text" text-anchor="middle" fill="#6d28d9">Analytics, Queues &amp; Logs</text>
    </g>
  </g>

  <!-- Worker Labels -->
  <g id="labels-worker">
    <rect x="1380" y="250" width="280" height="24" class="label-box" fill="#ffffff" stroke="#fed7aa" />
    <text x="1390" y="263" class="flow-text" fill="#c2410c"><tspan class="flow-num" fill="#ea580c">3.</tspan> Profile Details, Skills, Rates, Location</text>

    <rect x="1370" y="325" width="295" height="24" class="label-box" fill="#fff7ed" stroke="#fdba74" />
    <text x="1380" y="338" class="flow-text" fill="#c2410c"><tspan class="flow-num" fill="#ea580c">4.</tspan> Verification Status, Reviews, Rating Scores</text>
  </g>

  <!-- Data Store Labels -->
  <g id="labels-datastores">
    <!-- D1 Label -->
    <rect x="420" y="690" width="230" height="24" class="label-box" fill="#fffbeb" stroke="#fcd34d" />
    <text x="430" y="703" class="flow-text" fill="#b45309">Read / Write Credentials &amp; Roles</text>

    <!-- D2 Label -->
    <rect x="630" y="745" width="235" height="24" class="label-box" fill="#fffbeb" stroke="#fcd34d" />
    <text x="640" y="758" class="flow-text" fill="#b45309">Read / Write Worker Data &amp; Cat.</text>

    <!-- D3 Label -->
    <rect x="850" y="700" width="180" height="24" class="label-box" fill="#fffbeb" stroke="#fcd34d" />
    <text x="860" y="713" class="flow-text" fill="#b45309">Lookup Boundaries</text>

    <!-- D4 Label -->
    <rect x="1070" y="700" width="190" height="24" class="label-box" fill="#fffbeb" stroke="#fcd34d" />
    <text x="1080" y="713" class="flow-text" fill="#b45309">Store &amp; Aggregate Ratings</text>

    <!-- D5 Label -->
    <rect x="1235" y="745" width="225" height="24" class="label-box" fill="#fffbeb" stroke="#fcd34d" />
    <text x="1245" y="758" class="flow-text" fill="#b45309">Store &amp; Update Referral Status</text>

    <!-- D6 Label -->
    <rect x="1465" y="690" width="200" height="24" class="label-box" fill="#fffbeb" stroke="#fcd34d" />
    <text x="1475" y="703" class="flow-text" fill="#b45309">Append Administrative Actions</text>
  </g>

  <!-- ======================================================================== -->
  <!-- 3. CENTRAL PROCESS 0.0                                                   -->
  <!-- ======================================================================== -->
  <g id="center-process">
    <rect x="880" y="300" width="340" height="350" rx="36" fill="#ffffff" stroke="#059669" stroke-width="3" filter="url(#hub-shadow)" />
    <rect x="892" y="312" width="316" height="326" rx="28" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.6" />

    <g text-anchor="middle">
      <rect x="990" y="335" width="120" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
      <text x="1050" y="352" font-size="12" font-weight="800" fill="#047857" letter-spacing="1">PROCESS 0.0</text>

      <text x="1050" y="415" font-size="21" font-weight="800" fill="#065f46" letter-spacing="-0.3">KajBazar Platform</text>
      <text x="1050" y="440" font-size="13" fill="#047857" font-weight="600">Service Provider Directory Platform</text>

      <line x1="940" y1="465" x2="1160" y2="465" stroke="#a7f3d0" stroke-width="1.5" />

      <text x="1050" y="500" font-size="12" fill="#334155" font-weight="600">Central Orchestration Engine</text>
      <text x="1050" y="524" font-size="11.5" fill="#64748b" font-weight="500">Identity &amp; Taxonomy Routing</text>
      <text x="1050" y="546" font-size="11.5" fill="#64748b" font-weight="500">Reviews, Geo &amp; Referrals Aggregator</text>
      <text x="1050" y="568" font-size="11.5" fill="#64748b" font-weight="500">Administrative Auditing Pipeline</text>
    </g>
  </g>

  <!-- ======================================================================== -->
  <!-- 4. EXTERNAL ENTITIES (Top Row - Clean Typography, No Emojis)              -->
  <!-- ======================================================================== -->

  <!-- Consumer -->
  <g id="entity-consumer" filter="url(#soft-shadow)">
    <rect x="80" y="110" width="280" height="150" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" />
    <path d="M 80 122 Q 80 110 92 110 L 348 110 Q 360 110 360 122 L 360 148 L 80 148 Z" fill="#0284c7" />
    <text x="220" y="133" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="1">EXTERNAL ENTITY</text>
    <text x="220" y="185" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800">Consumer</text>
    <text x="220" y="212" text-anchor="middle" fill="#64748b" font-size="12" font-weight="500">Clients &amp; Service Seekers</text>
  </g>

  <!-- Administrator -->
  <g id="entity-admin" filter="url(#soft-shadow)">
    <rect x="910" y="110" width="280" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" />
    <path d="M 910 122 Q 910 110 922 110 L 1178 110 Q 1190 110 1190 122 L 1190 148 L 910 148 Z" fill="#7c3aed" />
    <text x="1050" y="133" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="1">EXTERNAL ENTITY</text>
    <text x="1050" y="182" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800">Administrator</text>
  </g>

  <!-- Service Provider / Worker -->
  <g id="entity-worker" filter="url(#soft-shadow)">
    <rect x="1740" y="110" width="280" height="150" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2.5" />
    <path d="M 1740 122 Q 1740 110 1752 110 L 2008 110 Q 2020 110 2020 122 L 2020 148 L 1740 148 Z" fill="#ea580c" />
    <text x="1880" y="133" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="1">EXTERNAL ENTITY</text>
    <text x="1880" y="185" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800">Service Provider</text>
    <text x="1880" y="212" text-anchor="middle" fill="#64748b" font-size="12" font-weight="500">Artisans, Technicians &amp; Labor</text>
  </g>

  <!-- ======================================================================== -->
  <!-- 5. CENTRAL DATA STORES (Cylinders)                                       -->
  <!-- ======================================================================== -->

  <!-- D1: Users & Roles Store -->
  <g id="ds-d1" transform="translate(90, 820)" filter="url(#soft-shadow)">
    <path d="M 0 16 A 140 22 0 0 0 280 16 L 280 100 A 140 22 0 0 1 0 100 Z" class="cylinder-body" />
    <ellipse cx="140" cy="16" rx="140" ry="20" class="cylinder-top" />
    <text x="140" y="58" text-anchor="middle" fill="#78350f" font-size="14" font-weight="800">D1: Users &amp; Roles Store</text>
    <text x="140" y="78" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="600">Auth, Accounts &amp; Permissions</text>
  </g>

  <!-- D2: Worker Profiles & Categories -->
  <g id="ds-d2" transform="translate(420, 820)" filter="url(#soft-shadow)">
    <path d="M 0 16 A 140 22 0 0 0 280 16 L 280 100 A 140 22 0 0 1 0 100 Z" class="cylinder-body" />
    <ellipse cx="140" cy="16" rx="140" ry="20" class="cylinder-top" />
    <text x="140" y="58" text-anchor="middle" fill="#78350f" font-size="14" font-weight="800">D2: Worker Profiles &amp; Categories</text>
    <text x="140" y="78" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="600">Bios, Skills &amp; Category Specs</text>
  </g>

  <!-- D3: Geography Store -->
  <g id="ds-d3" transform="translate(750, 820)" filter="url(#soft-shadow)">
    <path d="M 0 16 A 140 22 0 0 0 280 16 L 280 100 A 140 22 0 0 1 0 100 Z" class="cylinder-body" />
    <ellipse cx="140" cy="16" rx="140" ry="20" class="cylinder-top" />
    <text x="140" y="58" text-anchor="middle" fill="#78350f" font-size="14" font-weight="800">D3: Geography Store</text>
    <text x="140" y="78" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="600">Districts &amp; Upazila Boundaries</text>
  </g>

  <!-- D4: Ratings & Reviews Store -->
  <g id="ds-d4" transform="translate(1080, 820)" filter="url(#soft-shadow)">
    <path d="M 0 16 A 140 22 0 0 0 280 16 L 280 100 A 140 22 0 0 1 0 100 Z" class="cylinder-body" />
    <ellipse cx="140" cy="16" rx="140" ry="20" class="cylinder-top" />
    <text x="140" y="58" text-anchor="middle" fill="#78350f" font-size="14" font-weight="800">D4: Ratings &amp; Reviews Store</text>
    <text x="140" y="78" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="600">Star Ratings &amp; Client Feedback</text>
  </g>

  <!-- D5: Community Recommendations Store -->
  <g id="ds-d5" transform="translate(1410, 820)" filter="url(#soft-shadow)">
    <path d="M 0 16 A 140 22 0 0 0 280 16 L 280 100 A 140 22 0 0 1 0 100 Z" class="cylinder-body" />
    <ellipse cx="140" cy="16" rx="140" ry="20" class="cylinder-top" />
    <text x="140" y="58" text-anchor="middle" fill="#78350f" font-size="14" font-weight="800">D5: Recommendations Store</text>
    <text x="140" y="78" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="600">Offline Referrals &amp; Endorsements</text>
  </g>

  <!-- D6: Admin Audit Trail Store -->
  <g id="ds-d6" transform="translate(1740, 820)" filter="url(#soft-shadow)">
    <path d="M 0 16 A 140 22 0 0 0 280 16 L 280 100 A 140 22 0 0 1 0 100 Z" class="cylinder-body" />
    <ellipse cx="140" cy="16" rx="140" ry="20" class="cylinder-top" />
    <text x="140" y="58" text-anchor="middle" fill="#78350f" font-size="14" font-weight="800">D6: Audit Trail Store</text>
    <text x="140" y="78" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="600">Admin Actions &amp; Audit Logs</text>
  </g>

  <!-- ======================================================================== -->
  <!-- 6. NOTATION GUIDE / LEGEND                                               -->
  <!-- ======================================================================== -->
  <g transform="translate(70, 1160)" filter="url(#soft-shadow)">
    <rect width="1960" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    
    <text x="30" y="32" fill="#0f172a" font-size="13" font-weight="800" letter-spacing="0.5">NOTATION &amp; FLOW ARCHITECTURE GUIDE</text>
    <line x1="30" y1="46" x2="1930" y2="46" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Guide Item 1 -->
    <rect x="30" y="65" width="22" height="16" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="62" y="78" fill="#334155" font-size="12" font-weight="600">External Entity (Producer / Consumer)</text>

    <!-- Guide Item 2 -->
    <rect x="390" y="62" width="24" height="20" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="424" y="78" fill="#334155" font-size="12" font-weight="600">Core Level 0 Process (0.0)</text>

    <!-- Guide Item 3 -->
    <ellipse cx="730" cy="72" rx="14" ry="9" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="754" y="78" fill="#334155" font-size="12" font-weight="600">Persistent Central Data Store (D1 - D6)</text>

    <!-- Guide Item 4 -->
    <line x1="1100" y1="72" x2="1135" y2="72" stroke="#475569" stroke-width="2" />
    <circle cx="1135" cy="72" r="3" fill="#475569" />
    <text x="1147" y="78" fill="#334155" font-size="12" font-weight="600">Input Flow</text>

    <!-- Guide Item 5 -->
    <line x1="1270" y1="72" x2="1305" y2="72" stroke="#475569" stroke-width="2" stroke-dasharray="4 2" />
    <circle cx="1305" cy="72" r="3" fill="#475569" />
    <text x="1317" y="78" fill="#334155" font-size="12" font-weight="600">Output Response Flow</text>

    <!-- Guide Item 6 -->
    <line x1="1520" y1="72" x2="1560" y2="72" stroke="#d97706" stroke-width="2" />
    <circle cx="1520" cy="72" r="3" fill="#d97706" />
    <circle cx="1560" cy="72" r="3" fill="#d97706" />
    <text x="1572" y="78" fill="#334155" font-size="12" font-weight="600">Data Store Read / Write Interfacing</text>
  </g>
</svg>
