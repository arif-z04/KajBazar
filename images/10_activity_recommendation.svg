<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1350" width="100%" height="100%" style="background-color: #ffffff; font-family: sans-serif;">
  <defs>
    <!-- Arrowhead definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="650" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e293b">Community Offline Worker Recommendation Flow</text>

  <!-- Start Node -->
  <circle cx="650" cy="55" r="12" fill="#000000" />
  <line x1="650" y1="67" x2="650" y2="90" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- VisitRecommendPage -->
  <rect x="520" y="90" width="260" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="650" y="115" font-size="14" text-anchor="middle" fill="#1e3a8a">User Visits /recommend</text>
  <line x1="650" y1="130" x2="650" y2="155" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- CheckLogin -->
  <polygon points="650,155 740,195 650,235 560,195" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" />
  <text x="650" y="200" font-size="14" text-anchor="middle" fill="#92400e">Is User Authenticated?</text>

  <!-- CheckLogin -> PromptAuth (No) -->
  <line x1="560" y1="195" x2="400" y2="195" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="480" y="185" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">No</text>
  
  <rect x="200" y="175" width="200" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="300" y="200" font-size="14" text-anchor="middle" fill="#1e3a8a">Navigate /login</text>
  
  <line x1="200" y1="195" x2="120" y2="195" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- End Node (No Auth) -->
  <circle cx="100" cy="195" r="14" fill="none" stroke="#000000" stroke-width="2" />
  <circle cx="100" cy="195" r="8" fill="#000000" />
  <text x="100" y="225" font-size="12" text-anchor="middle" fill="#333333">End</text>

  <!-- CheckLogin -> FillRecommendation (Yes) -->
  <line x1="650" y1="235" x2="650" y2="270" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="665" y="255" font-size="12" fill="#333333" font-weight="bold">Yes</text>

  <!-- FillRecommendation Composite -->
  <rect x="460" y="270" width="380" height="255" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,5" />
  <text x="470" y="290" font-size="12" font-weight="bold" fill="#475569">FillRecommendation</text>

  <rect x="480" y="300" width="340" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="650" y="325" font-size="14" text-anchor="middle" fill="#1e3a8a">Enter Offline Worker Full Name &amp; Phone Number</text>
  <line x1="650" y1="340" x2="650" y2="360" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="480" y="360" width="340" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="650" y="385" font-size="14" text-anchor="middle" fill="#1e3a8a">Choose Skill Category, District &amp; Upazila</text>
  <line x1="650" y1="400" x2="650" y2="420" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="480" y="420" width="340" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="650" y="445" font-size="14" text-anchor="middle" fill="#1e3a8a">Add Workshop Location / Experience Notes</text>
  <line x1="650" y1="460" x2="650" y2="480" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="480" y="480" width="340" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="650" y="505" font-size="14" text-anchor="middle" fill="#1e3a8a">Click "Submit Offline Worker Referral"</text>

  <!-- FillRecommendation -> SendAPI -->
  <line x1="650" y1="525" x2="650" y2="555" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- SendAPI -->
  <rect x="520" y="555" width="260" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="650" y="580" font-size="14" text-anchor="middle" fill="#1e3a8a">POST /api/recommendations</text>
  <line x1="650" y1="595" x2="650" y2="625" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- StoreReferral Composite -->
  <rect x="470" y="625" width="360" height="210" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5" />
  <text x="480" y="645" font-size="12" font-weight="bold" fill="#475569">StoreReferral</text>

  <rect x="490" y="655" width="320" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="650" y="680" font-size="14" text-anchor="middle" fill="#1e3a8a">INSERT INTO community_recommendations</text>
  <line x1="650" y1="695" x2="650" y2="715" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="490" y="715" width="320" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="650" y="740" font-size="14" text-anchor="middle" fill="#1e3a8a">status = 'PENDING'</text>
  <line x1="650" y1="755" x2="650" y2="775" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="490" y="775" width="320" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="650" y="800" font-size="14" text-anchor="middle" fill="#1e3a8a">Return 200 OK</text>

  <!-- StoreReferral -> Sync Bar -->
  <line x1="650" y1="835" x2="650" y2="865" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="350" y="865" width="600" height="8" fill="#000000" />

  <!-- Split Paths -->
  <!-- User Path -->
  <line x1="380" y1="873" x2="380" y2="905" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="210" y="905" width="340" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="380" y="930" font-size="14" text-anchor="middle" fill="#1e3a8a">Referral in My Submitted Recommendations</text>
  
  <line x1="380" y1="945" x2="380" y2="975" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="380" cy="995" r="14" fill="none" stroke="#000000" stroke-width="2" />
  <circle cx="380" cy="995" r="8" fill="#000000" />
  <text x="380" y="1025" font-size="12" text-anchor="middle" fill="#333333">User Side End</text>

  <!-- Admin Path -->
  <line x1="920" y1="873" x2="920" y2="905" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- AdminModerationQueue Composite -->
  <rect x="580" y="880" width="680" height="400" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="5,5" />
  <text x="590" y="900" font-size="12" font-weight="bold" fill="#475569">AdminModerationQueue</text>

  <rect x="750" y="915" width="340" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="920" y="940" font-size="14" text-anchor="middle" fill="#1e3a8a">Admin views /admin Community Referrals Tab</text>
  <line x1="920" y1="955" x2="920" y2="975" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="750" y="975" width="340" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
  <text x="920" y="1000" font-size="14" text-anchor="middle" fill="#1e3a8a">Admin Calls Offline Worker &amp; Confirms Skills</text>
  <line x1="920" y1="1015" x2="920" y2="1035" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- AdminDecision -->
  <polygon points="920,1035 1010,1075 920,1115 830,1075" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" />
  <text x="920" y="1080" font-size="14" text-anchor="middle" fill="#92400e">Decision?</text>

  <!-- Approve Path -->
  <line x1="830" y1="1075" x2="720" y2="1075" stroke="#333333" stroke-width="2" />
  <line x1="720" y1="1075" x2="720" y2="1105" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="730" y="1065" font-size="12" text-anchor="middle" fill="#065f46" font-weight="bold">Worker Legitimate &amp; Willing</text>

  <!-- Reject Path -->
  <line x1="1010" y1="1075" x2="1120" y2="1075" stroke="#333333" stroke-width="2" />
  <line x1="1120" y1="1075" x2="1120" y2="1105" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1110" y="1065" font-size="12" text-anchor="middle" fill="#991b1b" font-weight="bold">Invalid Phone / Ineligible</text>

  <!-- ApproveAction Composite -->
  <rect x="590" y="1105" width="260" height="155" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="2" stroke-dasharray="5,5" />
  <text x="600" y="1125" font-size="12" font-weight="bold" fill="#475569">ApproveAction</text>

  <rect x="600" y="1135" width="240" height="30" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
  <text x="720" y="1155" font-size="13" text-anchor="middle" fill="#166534">SET status = 'APPROVED'</text>

  <rect x="600" y="1175" width="240" height="30" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
  <text x="720" y="1195" font-size="13" text-anchor="middle" fill="#166534">INSERT INTO admin_audit_logs</text>

  <rect x="600" y="1215" width="240" height="30" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" />
  <text x="720" y="1235" font-size="13" text-anchor="middle" fill="#166534">Admin provisions official profile</text>

  <!-- RejectAction Composite -->
  <rect x="1000" y="1105" width="240" height="115" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5" />
  <text x="1010" y="1125" font-size="12" font-weight="bold" fill="#475569">RejectAction</text>

  <rect x="1010" y="1135" width="220" height="30" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
  <text x="1120" y="1155" font-size="13" text-anchor="middle" fill="#991b1b">SET status = 'REJECTED'</text>

  <rect x="1010" y="1175" width="220" height="30" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
  <text x="1120" y="1195" font-size="13" text-anchor="middle" fill="#991b1b">INSERT INTO admin_audit_logs</text>

  <!-- End Node (Approve) -->
  <line x1="720" y1="1260" x2="720" y2="1295" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="720" cy="1315" r="14" fill="none" stroke="#000000" stroke-width="2" />
  <circle cx="720" cy="1315" r="8" fill="#000000" />
  <text x="720" y="1345" font-size="12" text-anchor="middle" fill="#333333">End</text>

  <!-- End Node (Reject) -->
  <line x1="1120" y1="1220" x2="1120" y2="1295" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="1120" cy="1315" r="14" fill="none" stroke="#000000" stroke-width="2" />
  <circle cx="1120" cy="1315" r="8" fill="#000000" />
  <text x="1120" y="1345" font-size="12" text-anchor="middle" fill="#333333">End</text>

</svg>
