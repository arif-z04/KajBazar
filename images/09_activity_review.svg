<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <style>
      .title { font-family: sans-serif; font-size: 20px; font-weight: bold; fill: #111; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 14px; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .label-dark { font-family: sans-serif; font-size: 14px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .label-small { font-family: sans-serif; font-size: 12px; fill: #333; }
      .box { rx: 5; ry: 5; stroke: #fff; stroke-width: 2; }
      .blue-box { fill: #3b82f6; }
      .green-box { fill: #059669; }
      .red-box { fill: #dc2626; }
      .diamond { fill: #fbbf24; stroke: #fff; stroke-width: 2; }
      .composite { fill: none; stroke: #666; stroke-width: 2; stroke-dasharray: 5,5; rx: 10; ry: 10; }
      .composite-label { font-family: sans-serif; font-size: 14px; font-style: italic; fill: #666; }
      .line { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line-no-arrow { stroke: #333; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="600" y="30" class="title">Review &amp; Rating Submission Flow</text>

  <!-- 1. Start -->
  <circle cx="600" cy="70" r="15" fill="#111" />
  <path d="M 600 85 L 600 105" class="line" />

  <!-- 2. ViewWorker -->
  <rect x="450" y="105" width="300" height="40" class="box blue-box" />
  <text x="600" y="125" class="label">Consumer Views Worker Detail Modal</text>
  <path d="M 600 145 L 600 185" class="line" />

  <!-- 3. CheckAuth Composite State -->
  <rect x="250" y="160" width="850" height="150" class="composite" />
  <text x="260" y="180" class="composite-label">CheckAuth</text>

  <!-- IsLoggedIn -->
  <polygon points="600,175 700,205 600,235 500,205" class="diamond" />
  <text x="600" y="205" class="label-dark">Is Consumer Authenticated?</text>
  
  <!-- IsLoggedIn - No -->
  <path d="M 500 205 L 430 205" class="line" />
  <text x="465" y="195" class="label-small">No</text>
  <rect x="280" y="185" width="150" height="40" class="box red-box" />
  <text x="355" y="205" class="label">Redirect to /login</text>
  <!-- End 1 -->
  <circle cx="250" cy="205" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="250" cy="205" r="6" fill="#111"/>
  <path d="M 280 205 L 265 205" class="line" />

  <!-- IsLoggedIn - Yes -->
  <path d="M 600 235 L 600 255" class="line" />
  <text x="615" y="245" class="label-small">Yes</text>

  <!-- CheckSelfReview -->
  <polygon points="600,255 700,285 600,315 500,285" class="diamond" />
  <text x="600" y="285" class="label-dark">Is Consumer the Worker?</text>
  
  <!-- CheckSelfReview - Yes -->
  <path d="M 700 285 L 750 285" class="line" />
  <text x="725" y="275" class="label-small">Yes</text>
  <rect x="750" y="265" width="220" height="40" class="box red-box" />
  <text x="860" y="285" class="label">Cannot review own profile</text>
  <!-- End 2 -->
  <circle cx="1020" cy="285" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="1020" cy="285" r="6" fill="#111"/>
  <path d="M 970 285 L 1005 285" class="line" />

  <!-- CheckSelfReview - No -->
  <path d="M 600 315 L 600 345" class="line" />
  <text x="615" y="330" class="label-small">No</text>

  <!-- 4. DisplayReviewForm -->
  <rect x="450" y="345" width="300" height="40" class="box blue-box" />
  <text x="600" y="365" class="label">Display Review Form</text>
  <path d="M 600 385 L 600 405" class="line" />

  <!-- 5. FillReview -->
  <rect x="450" y="405" width="300" height="40" class="box blue-box" />
  <text x="600" y="425" class="label">Select Star Rating (1-5) &amp; Enter Feedback</text>
  <path d="M 600 445 L 600 465" class="line" />

  <!-- 6. SubmitReview -->
  <rect x="450" y="465" width="300" height="40" class="box blue-box" />
  <text x="600" y="485" class="label">Click "Submit / Update Review"</text>
  <path d="M 600 505 L 600 525" class="line" />

  <!-- 7. ProcessReview Composite State -->
  <rect x="350" y="525" width="500" height="210" class="composite" />
  <text x="360" y="545" class="composite-label">ProcessReview</text>

  <!-- CheckPreviousReview -->
  <rect x="400" y="540" width="400" height="40" class="box blue-box" />
  <text x="600" y="560" class="label">SELECT FROM reviews WHERE consumer_id...</text>
  <path d="M 600 580 L 600 600" class="line" />

  <!-- Previous Review Exists? -->
  <polygon points="600,600 700,630 600,660 500,630" class="diamond" />
  <text x="600" y="630" class="label-dark">Previous Review Exists?</text>

  <!-- Yes -> UpdateRow -->
  <path d="M 500 630 L 480 630 L 480 660" class="line" />
  <text x="490" y="620" class="label-small">Yes</text>
  <rect x="380" y="660" width="200" height="40" class="box blue-box" />
  <text x="480" y="680" class="label">UPDATE reviews SET...</text>

  <!-- No -> InsertRow -->
  <path d="M 700 630 L 720 630 L 720 660" class="line" />
  <text x="710" y="620" class="label-small">No</text>
  <rect x="620" y="660" width="200" height="40" class="box blue-box" />
  <text x="720" y="680" class="label">INSERT INTO reviews</text>

  <!-- Merge point -->
  <path d="M 480 700 L 480 720 L 600 720" class="line-no-arrow" />
  <path d="M 720 700 L 720 720 L 600 720" class="line-no-arrow" />
  <path d="M 600 720 L 600 745" class="line" />

  <!-- 8. TriggerAggregation Composite State -->
  <rect x="350" y="745" width="500" height="110" class="composite" />
  <text x="360" y="765" class="composite-label">TriggerAggregation</text>

  <!-- RecalculateAggregate -->
  <rect x="450" y="755" width="300" height="40" class="box blue-box" />
  <text x="600" y="775" class="label">Compute AVG(rating) &amp; COUNT(*)</text>
  <path d="M 600 795 L 600 805" class="line" />

  <!-- SyncProfile -->
  <rect x="420" y="805" width="360" height="40" class="box blue-box" />
  <text x="600" y="825" class="label">UPDATE service_provider_profiles SET...</text>
  <path d="M 600 845 L 600 870" class="line" />

  <!-- 9. ReturnUpdatedStats -->
  <rect x="450" y="870" width="300" height="40" class="box green-box" />
  <text x="600" y="890" class="label">API Returns 200 OK</text>
  <path d="M 600 910 L 600 930" class="line" />

  <!-- 10. UpdateUI -->
  <rect x="450" y="930" width="300" height="40" class="box blue-box" />
  <text x="600" y="950" class="label">Client re-renders new star score</text>
  <path d="M 600 970 L 600 980" class="line" />

  <!-- 11. End -->
  <circle cx="600" cy="985" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="600" cy="985" r="6" fill="#111"/>

</svg>
