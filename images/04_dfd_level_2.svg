<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
    </marker>
    <!-- Blue Arrowhead -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a8a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#ffffff" />

  <!-- Title -->
  <text x="700" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827" text-anchor="middle">KajBazar Level 2 DFD - Search &amp; Contact Decomposition</text>

  <!-- Center Decomposition Box -->
  <rect x="420" y="210" width="500" height="660" fill="#f0fdf4" stroke="#059669" stroke-width="2" stroke-dasharray="8 4" rx="10" />
  <text x="430" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669">Process 3.0: Directory Search &amp; Contact</text>

  <!-- External Entity: Consumer -->
  <rect x="620" y="70" width="160" height="60" fill="#1e3a8a" rx="4" />
  <text x="700" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Consumer</text>

  <!-- Data Stores (Left) -->
  <!-- D2: service_provider_profiles -->
  <g transform="translate(150, 360)">
    <path d="M 180 0 L 0 0 L 0 40 L 180 40" fill="none" stroke="#d97706" stroke-width="2" />
    <line x1="30" y1="0" x2="30" y2="40" stroke="#d97706" stroke-width="2" />
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">D2</text>
    <text x="105" y="25" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">service_provider_profiles</text>
  </g>

  <!-- D2b: worker_categories -->
  <g transform="translate(150, 440)">
    <path d="M 180 0 L 0 0 L 0 40 L 180 40" fill="none" stroke="#d97706" stroke-width="2" />
    <line x1="30" y1="0" x2="30" y2="40" stroke="#d97706" stroke-width="2" />
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">D2b</text>
    <text x="105" y="25" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">worker_categories</text>
  </g>

  <!-- D3: categories -->
  <g transform="translate(150, 520)">
    <path d="M 180 0 L 0 0 L 0 40 L 180 40" fill="none" stroke="#d97706" stroke-width="2" />
    <line x1="30" y1="0" x2="30" y2="40" stroke="#d97706" stroke-width="2" />
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">D3</text>
    <text x="105" y="25" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">categories</text>
  </g>

  <!-- Data Stores (Right) -->
  <!-- D4: districts & upazilas -->
  <g transform="translate(1000, 520)">
    <path d="M 180 0 L 0 0 L 0 40 L 180 40" fill="none" stroke="#d97706" stroke-width="2" />
    <line x1="30" y1="0" x2="30" y2="40" stroke="#d97706" stroke-width="2" />
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">D4</text>
    <text x="105" y="25" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">districts &amp; upazilas</text>
  </g>

  <!-- D1: users -->
  <g transform="translate(1000, 680)">
    <path d="M 180 0 L 0 0 L 0 40 L 180 40" fill="none" stroke="#d97706" stroke-width="2" />
    <line x1="30" y1="0" x2="30" y2="40" stroke="#d97706" stroke-width="2" />
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">D1</text>
    <text x="105" y="25" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">users</text>
  </g>
  
  <!-- D5: reviews -->
  <g transform="translate(1000, 780)">
    <path d="M 180 0 L 0 0 L 0 40 L 180 40" fill="none" stroke="#d97706" stroke-width="2" />
    <line x1="30" y1="0" x2="30" y2="40" stroke="#d97706" stroke-width="2" />
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">D5</text>
    <text x="105" y="25" font-family="sans-serif" font-size="12" fill="#374151" text-anchor="middle">reviews</text>
  </g>

  <!-- Processes (Center) -->
  <!-- 3.1.1 Parse Query Parameters -->
  <circle cx="650" cy="300" r="45" fill="#059669" />
  <text x="650" y="295" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3.1.1 Parse</text>
  <text x="650" y="307" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Query</text>
  <text x="650" y="319" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Params</text>

  <!-- 3.1.2 Enforce Verification -->
  <circle cx="650" cy="380" r="45" fill="#059669" />
  <text x="650" y="375" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3.1.2 Enforce</text>
  <text x="650" y="387" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Verification</text>
  <text x="650" y="399" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Constraint</text>

  <!-- 3.1.3 Apply Category Filter -->
  <circle cx="650" cy="460" r="45" fill="#059669" />
  <text x="650" y="455" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3.1.3 Apply</text>
  <text x="650" y="467" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Category</text>
  <text x="650" y="479" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Filter</text>

  <!-- 3.1.4 Apply Location Filter -->
  <circle cx="650" cy="540" r="45" fill="#059669" />
  <text x="650" y="535" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3.1.4 Apply</text>
  <text x="650" y="547" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Location</text>
  <text x="650" y="559" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Filter</text>

  <!-- 3.1.5 Apply Minimum Rating -->
  <circle cx="650" cy="620" r="45" fill="#059669" />
  <text x="650" y="615" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3.1.5 Apply</text>
  <text x="650" y="627" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Min Rating &amp;</text>
  <text x="650" y="639" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Sort Order</text>

  <!-- 3.1.6 Slice Paginated Window -->
  <circle cx="650" cy="700" r="45" fill="#059669" />
  <text x="650" y="695" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3.1.6 Slice</text>
  <text x="650" y="707" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Paginated</text>
  <text x="650" y="719" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Window</text>

  <!-- 3.2.1 Reveal Phone Number -->
  <circle cx="780" cy="800" r="45" fill="#059669" />
  <text x="780" y="795" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3.2.1 Reveal</text>
  <text x="780" y="807" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Phone Num</text>
  <text x="780" y="819" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">(BR-06)</text>


  <!-- Flow Lines -->

  <!-- Consumer to 3.1.1 -->
  <path d="M 700 130 C 700 200, 650 200, 650 245" fill="none" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="630" y="190" font-family="sans-serif" font-size="10" fill="#1e3a8a">HTTP GET /workers/search</text>

  <!-- 3.1.1 to 3.1.2 -->
  <path d="M 650 345 L 650 325" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#arrow)" />
  <text x="660" y="338" font-family="sans-serif" font-size="10" fill="#374151">Validated Filter DTO</text>

  <!-- 3.1.2 to D2 -->
  <path d="M 605 380 L 340 380" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="470" y="373" font-family="sans-serif" font-size="10" fill="#374151" text-anchor="middle">Filter status=VERIFIED</text>

  <!-- 3.1.2 to 3.1.3 -->
  <path d="M 650 425 L 650 405" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#arrow)" />
  <text x="660" y="418" font-family="sans-serif" font-size="10" fill="#374151">Verified Candidates</text>

  <!-- 3.1.3 to D2b -->
  <path d="M 605 460 L 340 460" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="470" y="453" font-family="sans-serif" font-size="10" fill="#374151" text-anchor="middle">Join worker_categories</text>

  <!-- D2b to D3 -->
  <path d="M 240 480 L 240 510" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="245" y="500" font-family="sans-serif" font-size="10" fill="#374151">Lookup</text>

  <!-- 3.1.3 to 3.1.4 -->
  <path d="M 650 505 L 650 485" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#arrow)" />
  <text x="660" y="498" font-family="sans-serif" font-size="10" fill="#374151">Category-Filtered</text>

  <!-- 3.1.4 to D4 -->
  <path d="M 695 540 L 990 540" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="840" y="533" font-family="sans-serif" font-size="10" fill="#374151" text-anchor="middle">Filter district/upazila</text>

  <!-- 3.1.4 to 3.1.5 -->
  <path d="M 650 585 L 650 565" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#arrow)" />
  <text x="660" y="578" font-family="sans-serif" font-size="10" fill="#374151">Location-Filtered</text>

  <!-- 3.1.5 to 3.1.6 -->
  <path d="M 650 665 L 650 645" fill="none" stroke="#374151" stroke-width="2" marker-start="url(#arrow)" />
  <text x="660" y="658" font-family="sans-serif" font-size="10" fill="#374151">Rating Filter, ORDER BY</text>

  <!-- 3.1.6 to D2 (curved) -->
  <path d="M 605 700 C 400 700, 400 400, 340 395" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="440" y="550" font-family="sans-serif" font-size="10" fill="#374151" text-anchor="middle">COUNT &amp; Fetch page</text>

  <!-- 3.1.6 to D1 -->
  <path d="M 695 700 L 990 700" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="840" y="693" font-family="sans-serif" font-size="10" fill="#374151" text-anchor="middle">Join user info</text>

  <!-- 3.1.6 to Consumer -->
  <path d="M 605 700 C 500 700, 500 100, 610 100" fill="none" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="540" y="320" font-family="sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">Return JSON</text>
  
  <!-- Consumer to 3.2.1 -->
  <path d="M 780 100 C 880 100, 880 750, 805 765" fill="none" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="845" y="400" font-family="sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">Click Contact Worker</text>

  <!-- 3.2.1 to D1 -->
  <path d="M 815 770 C 850 720, 950 710, 990 710" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="910" y="735" font-family="sans-serif" font-size="10" fill="#374151" text-anchor="middle">Read phone</text>
  
  <!-- 3.2.1 to Consumer -->
  <path d="M 750 765 C 730 650, 780 150, 750 135" fill="none" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="770" y="450" font-family="sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">Render tel: link</text>

</svg>
